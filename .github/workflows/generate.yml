name: Generate

# apps/, the README icons and the README's app list are built from
# junkerderprovinz/unraid-apps. A pull request only checks that they are
# current, and main rebuilds them every night and on demand. Every file has to
# pass docker compose config before it lands.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "47 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: junkerderprovinz/unraid-apps
          path: feed

      - run: python3 -m pip install --quiet pyyaml

      - name: Check
        if: github.event_name == 'pull_request'
        run: python3 tools/generate.py feed --check

      - name: Build
        if: github.event_name != 'pull_request'
        run: python3 tools/generate.py feed

      - name: Validate
        run: |
          for file in apps/*.yaml; do
            docker compose -f "$file" config --quiet
          done

      - name: Commit
        if: github.event_name != 'pull_request'
        run: |
          git add apps .github/readme-icons README.md
          if git diff --cached --quiet; then
            echo "apps are current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild apps from unraid-apps $(git -C feed rev-parse --short HEAD)"
          git push
