# DesignCraft for TrueNAS, from junkerderprovinz/truenas-apps.
# Paste it under Apps, Discover Apps, then Install via YAML in the menu beside
# Custom App, and name the app designcraft.
#
# Replace tank with the name of your pool and fill in every value marked
# "required". Docker creates the folders on the first start. Create datasets
# for them first if you want snapshots of each one.
#
# Built from the Unraid template in junkerderprovinz/unraid-apps. Change the
# template there, not this file.

services:
  designcraft:
    image: junkerderprovinz/designcraft:latest
    container_name: designcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "32021:3001"
      - "32020:3000"
    volumes:
      - /mnt/tank/apps/designcraft:/config
      - /mnt/tank:/storage
    environment:
      TZ: Europe/Vienna
      PUID: "568"
      PGID: "568"
      UMASK: "022"
    labels:
      homepage.href: ''
      homepage.group: Productivity
      homepage.name: DesignCraft
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/designcraft/icon.png
      homepage.description: Page layout for magazines and flyers
      glance.name: DesignCraft
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/designcraft/icon.png
      glance.description: Page layout for magazines and flyers
