# Excalidraw for TrueNAS, from junkerderprovinz/truenas-apps.
# Paste it under Apps, Discover Apps, then Install via YAML in the menu beside
# Custom App, and name the app excalidraw.
#
# Replace tank with the name of your pool and fill in every value marked
# "required". Docker creates the folders on the first start. Create datasets
# for them first if you want snapshots of each one.
#
# Built from the Unraid template in junkerderprovinz/unraid-apps. Change the
# template there, not this file.

services:
  excalidraw:
    image: junkerderprovinz/excalidraw:latest
    container_name: excalidraw
    restart: unless-stopped
    ports:
      - "8443:443"
      - "8080:80"
    volumes:
      - /mnt/tank/apps/excalidraw:/config
    environment:
      ENABLE_LIBRARY: 'false'
      ENABLE_AI: 'false'
      TZ: Europe/Berlin
    labels:
      homepage.href: ''
      homepage.group: Productivity
      homepage.name: Excalidraw
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/excalidraw/icon.png?v=2
      homepage.description: Hand-drawn whiteboard with live collaboration
      glance.name: Excalidraw
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/excalidraw/icon.png?v=2
      glance.description: Hand-drawn whiteboard with live collaboration
