# DeckCraft for TrueNAS, from junkerderprovinz/truenas-apps.
# Paste it under Apps, Discover Apps, then Install via YAML in the menu beside
# Custom App, and name the app deckcraft.
#
# Replace tank with the name of your pool and fill in every value marked
# "required". Docker creates the folders on the first start. Create datasets
# for them first if you want snapshots of each one.
#
# Built from the Unraid template in junkerderprovinz/unraid-apps. Change the
# template there, not this file.

services:
  deckcraft:
    image: junkerderprovinz/deckcraft:latest
    container_name: deckcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "32011:3001"
      - "32010:3000"
    volumes:
      - /mnt/tank/apps/deckcraft:/config
      - /mnt/tank:/storage
    environment:
      TZ: Europe/Vienna
      PUID: "568"
      PGID: "568"
      UMASK: "022"
    labels:
      homepage.href: ''
      homepage.group: Productivity
      homepage.name: DeckCraft
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/deckcraft/icon.png
      homepage.description: Build and present slide decks in the browser
      glance.name: DeckCraft
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/deckcraft/icon.png
      glance.description: Build and present slide decks in the browser
