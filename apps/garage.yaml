# Garage for TrueNAS, from junkerderprovinz/truenas-apps.
# Paste it under Apps, Discover Apps, then Install via YAML in the menu beside
# Custom App, and name the app garage.
#
# Replace tank with the name of your pool and fill in every value marked
# "required". Docker creates the folders on the first start. Create datasets
# for them first if you want snapshots of each one.
#
# Built from the Unraid template in junkerderprovinz/unraid-apps. Change the
# template there, not this file.

services:
  garage:
    image: junkerderprovinz/garage:latest
    container_name: garage
    restart: unless-stopped
    ports:
      - "3900:3900"
      - "3909:3909"
      - "3902:3902"
    volumes:
      - /mnt/tank/apps/garage/data:/data
      - /mnt/tank/apps/garage/config:/config
    environment:
      DB_ENGINE: sqlite
      PUID: "568"
      PGID: "568"
    labels:
      homepage.href: ''
      homepage.group: Backup
      homepage.name: Garage
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/garage/icon.png?v=3
      homepage.description: S3-compatible object store with a web admin
      glance.name: Garage
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/garage/icon.png?v=3
      glance.description: S3-compatible object store with a web admin
