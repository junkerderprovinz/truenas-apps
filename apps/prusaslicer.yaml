# PrusaSlicer for TrueNAS, from junkerderprovinz/truenas-apps.
# Paste it under Apps, Discover Apps, then Install via YAML in the menu beside
# Custom App, and name the app prusaslicer.
#
# Replace tank with the name of your pool and fill in every value marked
# "required". Docker creates the folders on the first start. Create datasets
# for them first if you want snapshots of each one.
#
# Built from the Unraid template in junkerderprovinz/unraid-apps. Change the
# template there, not this file.

services:
  prusaslicer:
    image: junkerderprovinz/prusaslicer:latest
    container_name: prusaslicer
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "32131:3001"
      - "32130:3000"
    volumes:
      - /mnt/tank/apps/prusaslicer:/config
      - /mnt/tank:/storage
    environment:
      TZ: Europe/Vienna
      PUID: "568"
      PGID: "568"
      UMASK: "022"
    labels:
      homepage.href: ''
      homepage.group: Tools
      homepage.name: PrusaSlicer
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/prusaslicer/icon.png?v=3
      homepage.description: 3D-printing slicer in the browser
      glance.name: PrusaSlicer
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/prusaslicer/icon.png?v=3
      glance.description: 3D-printing slicer in the browser
