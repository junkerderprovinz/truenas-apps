# GridCraft for TrueNAS, from junkerderprovinz/truenas-apps.
# Paste it under Apps, Discover Apps, then Install via YAML in the menu beside
# Custom App, and name the app gridcraft.
#
# Replace tank with the name of your pool and fill in every value marked
# "required". Docker creates the folders on the first start. Create datasets
# for them first if you want snapshots of each one.
#
# Built from the Unraid template in junkerderprovinz/unraid-apps. Change the
# template there, not this file.

services:
  gridcraft:
    image: junkerderprovinz/gridcraft:latest
    container_name: gridcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "32061:3001"
      - "32060:3000"
    volumes:
      - /mnt/tank/apps/gridcraft:/config
      - /mnt/tank:/storage
    environment:
      TZ: Europe/Vienna
      PUID: "568"
      PGID: "568"
      UMASK: "022"
    labels:
      homepage.href: ''
      homepage.group: Productivity
      homepage.name: GridCraft
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/gridcraft/icon.png
      homepage.description: Spreadsheets with formulas and charts
      glance.name: GridCraft
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/gridcraft/icon.png
      glance.description: Spreadsheets with formulas and charts
