# CastleParcel for TrueNAS, from junkerderprovinz/truenas-apps.
# Paste it under Apps, Discover Apps, then Install via YAML in the menu beside
# Custom App, and name the app castleparcel.
#
# Replace tank with the name of your pool and fill in every value marked
# "required". Docker creates the folders on the first start. Create datasets
# for them first if you want snapshots of each one.
#
# Built from the Unraid template in junkerderprovinz/unraid-apps. Change the
# template there, not this file.

services:
  castleparcel:
    image: junkerderprovinz/castleparcel:latest
    container_name: castleparcel
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - /mnt/tank/apps/castleparcel/data:/data
      - /mnt/tank/apps/castleparcel/config:/config
    environment:
      CONFIG_DIR: /config
      DEFAULT_EXPIRY: 7d
      MAX_FILE_SIZE: "0"
      MAX_EXPIRY: never
      STORAGE_QUOTA: "0"
      RATE_LIMIT: 'true'
      TRUST_PROXY: 'false'
    labels:
      homepage.href: ''
      homepage.group: Tools
      homepage.name: CastleParcel
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/castleparcel/icon.png?v=2
      homepage.description: Encrypted big-file transfers and share links
      glance.name: CastleParcel
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/castleparcel/icon.png?v=2
      glance.description: Encrypted big-file transfers and share links
