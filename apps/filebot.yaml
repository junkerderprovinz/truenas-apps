# FileBot for TrueNAS, from junkerderprovinz/truenas-apps.
# Paste it under Apps, Discover Apps, then Install via YAML in the menu beside
# Custom App, and name the app filebot.
#
# Replace tank with the name of your pool and fill in every value marked
# "required". Docker creates the folders on the first start. Create datasets
# for them first if you want snapshots of each one.
#
# Built from the Unraid template in junkerderprovinz/unraid-apps. Change the
# template there, not this file.

services:
  filebot:
    image: junkerderprovinz/filebot:latest
    container_name: filebot
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "32181:3001"
      - "32180:3000"
    volumes:
      - /mnt/tank/apps/filebot:/config
      - /mnt/tank:/storage
    environment:
      TZ: Europe/Vienna
      PUID: "568"
      PGID: "568"
      UMASK: "022"
      FILEBOT_THEME: Darcula
      AMC_ENABLED: "0"
      AMC_INPUT_DIR: /watch
      AMC_OUTPUT_DIR: /output
      AMC_ACTION: test
      AMC_CONFLICT: auto
      AMC_MATCH_MODE: opportunistic
      AMC_LANG: English
      AMC_INTERVAL: "1800"
      AMC_INPUT_STABLE_TIME: "10"
      AMC_PROCESS_MUSIC: y
      AMC_ARTWORK: n
    labels:
      homepage.href: ''
      homepage.group: Media
      homepage.name: FileBot
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/filebot/icon.png
      homepage.description: Media renamer on a web desktop
      glance.name: FileBot
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/filebot/icon.png
      glance.description: Media renamer on a web desktop
