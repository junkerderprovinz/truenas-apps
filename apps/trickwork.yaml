# TrickWork for TrueNAS, from junkerderprovinz/truenas-apps.
# Paste it under Apps, Discover Apps, then Install via YAML in the menu beside
# Custom App, and name the app trickwork.
#
# Replace tank with the name of your pool and fill in every value marked
# "required". Docker creates the folders on the first start. Create datasets
# for them first if you want snapshots of each one.
#
# Built from the Unraid template in junkerderprovinz/unraid-apps. Change the
# template there, not this file.

services:
  trickwork:
    image: ghcr.io/junkerderprovinz/trickwork:latest
    container_name: trickwork
    restart: unless-stopped
    ports:
      - "3210:3210"
    environment:
      PORT: "3210"
    labels:
      homepage.href: ''
      homepage.group: Tools
      homepage.name: TrickWork
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/trickwork/icon.png?v=5
      homepage.description: Turns images into ASCII art
      glance.name: TrickWork
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/trickwork/icon.png?v=5
      glance.description: Turns images into ASCII art
