# JDownloader for TrueNAS, from junkerderprovinz/truenas-apps.
# Paste it under Apps, Discover Apps, then Install via YAML in the menu beside
# Custom App, and name the app jdownloader.
#
# Replace tank with the name of your pool and fill in every value marked
# "required". Docker creates the folders on the first start. Create datasets
# for them first if you want snapshots of each one.
#
# Built from the Unraid template in junkerderprovinz/unraid-apps. Change the
# template there, not this file.

services:
  jdownloader:
    image: junkerderprovinz/jdownloader:latest
    container_name: jdownloader
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "32080:3000"
      - "32081:3001"
    volumes:
      - /mnt/tank/apps/jdownloader:/config
      - /mnt/tank/downloads:/downloads
    environment:
      JD_THEME: jd-highlighter-dark
      JD_SELFUPDATE: 'true'
      JD_ENABLE_BROWSER: auto
      TZ: Europe/Vienna
      PUID: "568"
      PGID: "568"
      UMASK: "022"
    labels:
      homepage.href: ''
      homepage.group: Downloads
      homepage.name: JDownloader
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/jdownloader/icon.png
      homepage.description: Download manager on a web desktop
      glance.name: JDownloader
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/jdownloader/icon.png
      glance.description: Download manager on a web desktop
