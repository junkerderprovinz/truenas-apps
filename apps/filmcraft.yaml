# FilmCraft for TrueNAS, from junkerderprovinz/truenas-apps.
# Paste it under Apps, Discover Apps, then Install via YAML in the menu beside
# Custom App, and name the app filmcraft.
#
# Replace tank with the name of your pool and fill in every value marked
# "required". Docker creates the folders on the first start. Create datasets
# for them first if you want snapshots of each one.
#
# Built from the Unraid template in junkerderprovinz/unraid-apps. Change the
# template there, not this file.

services:
  filmcraft:
    image: junkerderprovinz/filmcraft:latest
    container_name: filmcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "32051:3001"
      - "32050:3000"
    volumes:
      - /mnt/tank/apps/filmcraft:/config
      - /mnt/tank:/storage
    environment:
      TZ: Europe/Vienna
      PUID: "568"
      PGID: "568"
      UMASK: "022"
    labels:
      homepage.href: ''
      homepage.group: Media
      homepage.name: FilmCraft
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/filmcraft/icon.png
      homepage.description: Video editor in the browser
      glance.name: FilmCraft
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/filmcraft/icon.png
      glance.description: Video editor in the browser
