# VectorCraft for TrueNAS, from junkerderprovinz/truenas-apps.
# Paste it under Apps, Discover Apps, then Install via YAML in the menu beside
# Custom App, and name the app vectorcraft.
#
# Replace tank with the name of your pool and fill in every value marked
# "required". Docker creates the folders on the first start. Create datasets
# for them first if you want snapshots of each one.
#
# Built from the Unraid template in junkerderprovinz/unraid-apps. Change the
# template there, not this file.

services:
  vectorcraft:
    image: junkerderprovinz/vectorcraft:latest
    container_name: vectorcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "32161:3001"
      - "32160:3000"
    volumes:
      - /mnt/tank/apps/vectorcraft:/config
      - /mnt/tank:/storage
    environment:
      TZ: Europe/Vienna
      PUID: "568"
      PGID: "568"
      UMASK: "022"
    labels:
      homepage.href: ''
      homepage.group: Productivity
      homepage.name: VectorCraft
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/vectorcraft/icon.png
      homepage.description: Vector illustration with SVG and PDF
      glance.name: VectorCraft
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/vectorcraft/icon.png
      glance.description: Vector illustration with SVG and PDF
