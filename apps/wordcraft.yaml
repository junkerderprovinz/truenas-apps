# WordCraft for TrueNAS, from junkerderprovinz/truenas-apps.
# Paste it under Apps, Discover Apps, then Install via YAML in the menu beside
# Custom App, and name the app wordcraft.
#
# Replace tank with the name of your pool and fill in every value marked
# "required". Docker creates the folders on the first start. Create datasets
# for them first if you want snapshots of each one.
#
# Built from the Unraid template in junkerderprovinz/unraid-apps. Change the
# template there, not this file.

services:
  wordcraft:
    image: junkerderprovinz/wordcraft:latest
    container_name: wordcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "32171:3001"
      - "32170:3000"
    volumes:
      - /mnt/tank/apps/wordcraft:/config
      - /mnt/tank:/storage
    environment:
      TZ: Europe/Vienna
      PUID: "568"
      PGID: "568"
      UMASK: "022"
    labels:
      homepage.href: ''
      homepage.group: Productivity
      homepage.name: WordCraft
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/wordcraft/icon.png
      homepage.description: Word processor in the browser
      glance.name: WordCraft
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/wordcraft/icon.png
      glance.description: Word processor in the browser
