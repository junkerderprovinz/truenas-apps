# SeaweedFS for TrueNAS, from junkerderprovinz/truenas-apps.
# Paste it under Apps, Discover Apps, then Install via YAML in the menu beside
# Custom App, and name the app seaweedfs.
#
# Replace tank with the name of your pool and fill in every value marked
# "required". Docker creates the folders on the first start. Create datasets
# for them first if you want snapshots of each one.
#
# Built from the Unraid template in junkerderprovinz/unraid-apps. Change the
# template there, not this file.

services:
  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: seaweedfs
    restart: unless-stopped
    ports:
      - "8333:8333"
      - "23646:23646"
      - "9333:9333"
      - "8888:8888"
    volumes:
      - /mnt/tank/apps/seaweedfs/data:/data
    labels:
      homepage.href: ''
      homepage.group: Backup
      homepage.name: SeaweedFS
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/seaweedfs/icon.png?v=2
      homepage.description: S3-compatible object store
      glance.name: SeaweedFS
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/seaweedfs/icon.png?v=2
      glance.description: S3-compatible object store
