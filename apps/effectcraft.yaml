# EffectCraft for TrueNAS, from junkerderprovinz/truenas-apps.
# Paste it under Apps, Discover Apps, then Install via YAML in the menu beside
# Custom App, and name the app effectcraft.
#
# Replace tank with the name of your pool and fill in every value marked
# "required". Docker creates the folders on the first start. Create datasets
# for them first if you want snapshots of each one.
#
# Built from the Unraid template in junkerderprovinz/unraid-apps. Change the
# template there, not this file.

services:
  effectcraft:
    image: junkerderprovinz/effectcraft:latest
    container_name: effectcraft
    restart: unless-stopped
    shm_size: 1gb
    ports:
      - "32031:3001"
      - "32030:3000"
    volumes:
      - /mnt/tank/apps/effectcraft:/config
      - /mnt/tank:/storage
    environment:
      TZ: Europe/Vienna
      PUID: "568"
      PGID: "568"
      UMASK: "022"
    labels:
      homepage.href: ''
      homepage.group: Media
      homepage.name: EffectCraft
      homepage.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/effectcraft/icon.png
      homepage.description: Motion graphics with keyframes and effects
      glance.name: EffectCraft
      glance.icon: https://raw.githubusercontent.com/junkerderprovinz/unraid-apps/main/effectcraft/icon.png
      glance.description: Motion graphics with keyframes and effects
